<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل مساجد ومقار الأوقاف - بلدية العربان</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        header h1 {
            color: #1e73e8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        header p {
            color: #666;
            font-size: 14px;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 25px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #1e73e8;
        }
        .service-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .service-title-area h4 {
            font-size: 18px;
            color: #222;
            margin-bottom: 5px;
        }
        .service-title-area p {
            font-size: 13px;
            color: #777;
        }
        .badge {
            display: inline-block;
            background: #eef2f7;
            color: #1e73e8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
        }
        .docs-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: none;
        }
        .docs-container.show {
            display: block;
        }
        .docs-container ul {
            list-style-type: none;
            padding-right: 0;
        }
        .docs-container li {
            font-size: 14px;
            color: #555;
            padding: 5px 0;
            position: relative;
            padding-right: 18px;
        }
        .docs-container li::before {
            content: "•";
            color: #1e73e8;
            font-weight: bold;
            position: absolute;
            right: 0;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🕌 دليل مساجد ومقار الأوقاف</h1>
            <p>بلدية العربان - تعرف على المساجد، ومقار التحفيظ، والمرافق الدينية</p>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المسجد أو الحي...">

        <div id="servicesContainer">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </div>

        <footer>
            <p>© 2026 بلدية العربان | تصميم وتطوير المنظومة</p>
        </footer>
    </div>

    <!-- استدعاء ملف الجافاسكريبت المنفصل -->
    <script src="script.js"></script>
</body>
</html>
